name: required-pr-tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-tests:
    runs-on: windows-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: changes
        run: |
          $changed = git diff --name-only origin/main...HEAD
          $hasCode = $changed | Where-Object {
            $_ -match '\.(cs|csproj|sln)$' -or
            $_ -match '^\.github/workflows/.*\.ya?ml$' -or
            $_ -match '^scripts/.*\.ps1$'
          }
          $result = if ($hasCode.Count -gt 0) { 'true' } else { 'false' }
          echo "has_code=$result" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        if: steps.changes.outputs.has_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run required tests with hard fail timeout
        if: steps.changes.outputs.has_code == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $totalTimeoutSeconds = 300
          $deadline = (Get-Date).AddSeconds($totalTimeoutSeconds)

          function Invoke-TestWithRemainingBudget {
            param(
              [Parameter(Mandatory = $true)][string]$ProjectPath,
              [Parameter(Mandatory = $true)][string]$WorkingDirectory,
              [string[]]$AdditionalArguments = @()
            )

            $remainingSeconds = [int][Math]::Floor(($deadline - (Get-Date)).TotalSeconds)
            if ($remainingSeconds -le 0) {
              throw "Required PR tests failed: exceeded ${totalTimeoutSeconds}s total timeout before running $ProjectPath."
            }

            Write-Host "Running $ProjectPath with $remainingSeconds seconds remaining."
            $testArguments = @('test', $ProjectPath, '--configuration', 'Release', '--nologo') + $AdditionalArguments
            $process = Start-Process -FilePath 'dotnet' -ArgumentList $testArguments -WorkingDirectory $WorkingDirectory -NoNewWindow -PassThru

            if (-not $process.WaitForExit($remainingSeconds * 1000)) {
              try {
                $process.Kill($true)
              }
              catch {
                Write-Warning "Could not kill timed out process for ${ProjectPath}: $($_.Exception.Message)"
              }

              throw "Required PR tests failed: exceeded ${totalTimeoutSeconds}s total timeout while running $ProjectPath."
            }

            if ($process.ExitCode -ne 0) {
              throw "dotnet test failed for $ProjectPath with exit code $($process.ExitCode)."
            }
          }

          Invoke-TestWithRemainingBudget -ProjectPath 'TopKFinder.Tests.csproj' -WorkingDirectory './tests/TopKFinder.Tests'
          Invoke-TestWithRemainingBudget `
            -ProjectPath 'TopKFinder.PerfTests.csproj' `
            -WorkingDirectory './tests/TopKFinder.PerfTests' `
            -AdditionalArguments @('--filter', 'FullyQualifiedName!~ProofTightenPerfGateTests')
